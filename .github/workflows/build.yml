name: Build

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install toolchain
              run: |
                  sudo apt-get update
                  sudo apt-get install -y nasm gcc binutils

            - name: Build
              run: make

            - name: Verify output image exists
              run: test -f Build/apex.img
