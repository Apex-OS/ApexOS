name: Feature request
description: Suggest a new subsystem, command, or improvement
labels: ["enhancement"]
body:
    - type: textarea
      id: problem
      attributes:
          label: What's missing or limiting
          description: What can't you do today, or what's awkward?
      validations:
          required: true

    - type: textarea
      id: proposal
      attributes:
          label: Proposed approach
          description: If you have one in mind. Open an issue to discuss before writing code — see CONTRIBUTING.md.

    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives considered
